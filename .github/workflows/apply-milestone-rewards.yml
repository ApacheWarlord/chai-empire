name: Apply milestone reward integration

on:
  push:
    branches:
      - codex/gameplay-v3

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run milestone reward integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply milestone reward changes
        run: python3 .v02/milestone_rewards.py

      - name: Validate tests and all-platform export
        working-directory: app
        run: |
          npm ci
          npm test
          npx expo export --platform all --output-dir dist-milestone-check

      - name: Commit validated milestone rewards
        run: |
          rm -rf app/dist-milestone-check
          git config user.name 'ApacheWarlord'
          git config user.email 'dhimanpulkit38496@gmail.com'
          git rm .v02/milestone_rewards.py .github/workflows/apply-milestone-rewards.yml
          git add app/App.js app/src/components/GameDrawer.js app/src/data/gameData.js app/src/game/createInitialState.js app/src/game/simulation.js app/src/hooks/useGameState.js app/tests/stabilization.test.js
          git commit -m 'Add claimable Empire milestone rewards'
          git push origin HEAD:codex/gameplay-v3
