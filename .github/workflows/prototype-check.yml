name: Chai Empire Prototype Check

on:
  push:
    branches:
      - codex/pixel-art-gameplay-v2
  pull_request:
    branches:
      - codex/stabilize-game-loop

jobs:
  prototype-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run game tests
        run: npm test

      - name: Export web prototype
        run: npm run export:web -- --output-dir dist

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: chai-empire-web-prototype
          path: app/dist
          if-no-files-found: error
