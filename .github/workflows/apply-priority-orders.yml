name: Apply Priority Orders Feature and Polish

on:
  push:
    branches:
      - codex/gameplay-v3

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run priority orders feature and polish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Apply Priority Orders feature
        run: python3 .v02/priority_orders_feature.py

      - name: Validate feature pass
        working-directory: app
        run: |
          npm test
          npx expo export --platform all --output-dir dist-feature-check

      - name: Commit feature pass locally
        run: |
          rm -rf app/dist-feature-check
          git config user.name 'ApacheWarlord'
          git config user.email 'dhimanpulkit38496@gmail.com'
          git add app/App.js app/src/components/PriorityOrderPrompt.js app/src/game/createInitialState.js app/src/game/simulation.js app/src/hooks/useGameState.js app/tests/stabilization.test.js app/tests/bootGameState.test.js
          git commit -m 'Add interactive priority orders'

      - name: Apply polish pass
        run: python3 .v02/priority_orders_polish.py

      - name: Validate polish pass
        working-directory: app
        run: |
          npm test
          npx expo export --platform all --output-dir dist-polish-check

      - name: Commit polish and publish
        run: |
          rm -rf app/dist-polish-check
          git rm .v02/priority_orders_feature.py .v02/priority_orders_polish.py .github/workflows/apply-priority-orders.yml
          git add app/App.js app/src/components/PriorityOrderPrompt.js app/src/components/GameDrawer.js app/src/components/GameFeedback.js app/tests/stabilization.test.js
          git commit -m 'Polish rush feedback and express order UX'
          git push origin HEAD:codex/gameplay-v3
