name: Apply Chai Empire Polish Audit

on:
  push:
    branches:
      - codex/pixel-art-gameplay-v2

permissions:
  contents: write

jobs:
  apply-polish:
    if: github.event.head_commit.message == 'Run staged polish patches'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply staged audit patches
        run: |
          cat .polish/app-ui.part00 .polish/app-ui.part01 .polish/app-ui.part02 > /tmp/app-ui.patch
          git apply --check /tmp/app-ui.patch
          git apply /tmp/app-ui.patch
          git apply --check .polish/logic-tests.patch
          git apply .polish/logic-tests.patch

      - name: Validate polished game
        working-directory: app
        run: |
          npm ci
          npm test
          npx expo export --platform all --output-dir dist-polish-check

      - name: Commit polished prototype
        run: |
          rm -rf app/dist-polish-check
          git config user.name 'ApacheWarlord'
          git config user.email 'dhimanpulkit38496@gmail.com'
          git add app/App.js app/app.json app/src/game/simulation.js app/src/game/saveRecovery.js app/tests/stabilization.test.js app/tests/saveRecovery.test.js
          git commit -m 'Apply prototype polish audit fixes'
          git push origin HEAD:codex/pixel-art-gameplay-v2
