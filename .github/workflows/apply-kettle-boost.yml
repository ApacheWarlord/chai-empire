name: Apply Kettle Boost Integration

on:
  push:
    branches:
      - codex/gameplay-v3

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run Kettle Boost integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply Kettle Boost feature
        run: |
          python3 .v02/kettle_boost.py
          python3 .v02/kettle_boost_test_fix.py

      - name: Validate tests and all-platform export
        working-directory: app
        run: |
          npm ci
          npm test
          npx expo export --platform all --output-dir dist-kettle-check

      - name: Commit validated Kettle Boost integration
        run: |
          rm -rf app/dist-kettle-check
          git config user.name 'ApacheWarlord'
          git config user.email 'dhimanpulkit38496@gmail.com'
          git rm .v02/kettle_boost.py .v02/kettle_boost_test_fix.py .v02/run-kettle-boost.txt .github/workflows/apply-kettle-boost.yml
          git add app/App.js app/src/components/GameDrawer.js app/src/components/GameFeedback.js app/src/game/createInitialState.js app/src/game/simulation.js app/src/hooks/useGameState.js app/tests/stabilization.test.js app/tests/bootGameState.test.js
          git commit -m 'Add interactive Kettle Boost rush mechanic'
          git push origin HEAD:codex/gameplay-v3
