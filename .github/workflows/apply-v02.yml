name: Apply Chai Empire v0.2 Integration

on:
  push:
    branches:
      - codex/gameplay-v3

permissions:
  contents: write

jobs:
  integrate-v02:
    if: github.event.head_commit.message == 'Run v0.2 integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply v0.2 integration
        run: python3 .v02/apply_v02.py

      - name: Sync lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate v0.2
        working-directory: app
        run: |
          npm ci
          npm test
          npx expo export --platform all --output-dir dist-v02-check

      - name: Commit validated v0.2
        run: |
          rm -rf app/dist-v02-check
          git config user.name 'ApacheWarlord'
          git config user.email 'dhimanpulkit38496@gmail.com'
          git rm .v02/v02.patch .v02/apply_v02.py .v02/run.txt .github/workflows/apply-v02.yml
          git add app/App.js app/app.json app/package.json app/package-lock.json app/src/game/createInitialState.js app/tests/stabilization.test.js
          git commit -m 'Integrate Chai Empire v0.2 gameplay shell'
          git push origin HEAD:codex/gameplay-v3
